  list.addEventListener("click",function(e){
    var it=e.target.closest(".tk-dditem");if(!it)return;
    S.sekolah=it.getAttribute("data-v");S.npsn=it.getAttribute("data-npsn");save();
    inp.value=S.sekolah;hideSchoolList();
  });
}
function resolveSchool(){
  var inp=document.getElementById("tk-sekolah-input");
  var typed=inp?inp.value.trim():"";
  if(!typed)return null;
  var tl=typed.toLowerCase();
  for(var i=0;i<SCHOOLS.length;i++)if(SCHOOLS[i].nama.toLowerCase()===tl)return SCHOOLS[i];
  return null;
}
function syncMenuInputs(){
  var nm=document.getElementById("tk-nama"),rb=document.getElementById("tk-rombel");
  if(nm)S.nama=nm.value;
  if(rb)S.rombel=rb.value.trim().toUpperCase().slice(0,6);
  var kc=document.getElementById("tk-kecamatan");
  if(kc)S.kecamatan=kc.value;
}

/* ===== Alur sesi ===== */
function startGame(){
  syncMenuInputs();
  var sk=resolveSchool();
  if(!S.nama.trim()||!S.rombel.trim()||!S.kecamatan||!sk){
    set({menuMsg:"Isi nama, rombel, pilih kecamatan, dan pilih sekolah dari daftar ya!"});return;
  }
  S.sekolah=sk.nama;S.npsn=sk.npsn;
  var now=Date.now();
  var items=drawSession();
  set({screen:"game",items:items,answers:blankAnswers(items),cur:0,
    startAt:now,deadline:now+TOTAL_TIME*1000,result:null,saved:0,menuMsg:null,confirmOpen:false,copied:false});
  window.scrollTo(0,0);
}
function grade(){
  var pts=0,d={pg:0,mcma:0,bsStmt:0,bsFull:0,full:0};
  var det=[];
  S.items.forEach(function(it,i){
    var a=S.answers?S.answers[i]:null,ok=false,po=0;
    if(it.type==="pg"){
      ok=(a!==null&&it.options[a].ok);
      if(ok){po=2;d.pg++;d.full++;}
    }else if(it.type==="mcma"){
      var correct=[];it.options.forEach(function(o,j){if(o.ok)correct.push(j);});
      ok=!!(a&&a.length===correct.length&&correct.every(function(k){return a.indexOf(k)>=0;}));
      if(ok){po=3.5;d.mcma++;d.full++;}
    }else{
      var c=0;for(var j=0;j<it.key.length;j++)if(a&&a[j]===it.key[j])c++;
      po=c*(3.5/it.key.length);d.bsStmt+=c;
      ok=(c===it.key.length);if(ok){d.bsFull++;d.full++;}
    }
    pts+=po;
    det.push({id:it.bank,ok:ok,poin:Math.round(po*100)/100});
  });
  pts=Math.round(pts*100)/100;
  return{poin:pts,nilai:Math.round(pts/MAX_POIN*1000)/10,d:d,det:det};
}
function finishGame(auto){
  if(S.screen!=="game")return;
  var g=grade();
  var used=auto?TOTAL_TIME:Math.min(TOTAL_TIME,Math.max(0,Math.round((Date.now()-S.startAt)/1000)));
  set({screen:"result",confirmOpen:false,saved:1,
    result:{nilai:g.nilai,poin:g.poin,d:g.d,det:g.det,durasi:used,auto:!!auto}});
  window.scrollTo(0,0);
  saveScore(g,used);
}

/* ===== Simpan nilai: Firestore REST API (tanpa SDK/CDN) + antrean offline ===== */
function fsEncode(v){
  if(v===null||v===undefined)return{nullValue:null};
  if(typeof v==="string")return{stringValue:v};
  if(typeof v==="boolean")return{booleanValue:v};
  if(typeof v==="number")return Number.isInteger(v)?{integerValue:String(v)}:{doubleValue:v};
  if(v instanceof Date)return{timestampValue:v.toISOString()};
  if(Array.isArray(v))return{arrayValue:{values:v.map(fsEncode)}};
  var o={};for(var k in v)o[k]=fsEncode(v[k]);
  return{mapValue:{fields:o}};
}
function fsURL(path){return "https://firestore.googleapis.com/v1/projects/"+PROJECT+"/databases/(default)/documents"+path+"?key="+API_KEY;}
function saveScore(g,used){
  var payload={
    nama:S.nama.trim(),kelas:"IX",rombel:S.rombel.trim(),sekolah:S.sekolah,npsn:S.npsn,kecamatan:S.kecamatan,
    skor:g.nilai,nilai:g.nilai,poin:g.poin,benar:g.d.full,total:TOTAL_Q,
    benarPG:g.d.pg,benarMCMA:g.d.mcma,benarBS:g.d.bsStmt,bsPenuh:g.d.bsFull,
    rincian:g.det,durasi:used,createdAt:new Date()
  };
  var body=JSON.stringify({fields:fsEncode(payload).mapValue.fields});
  fetch(fsURL("/"+COLLECTION),{method:"POST",headers:{"Content-Type":"application/json"},body:body})
    .then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);if(S.screen==="result")set({saved:2},true);})
    .catch(function(){
      var q=store.get(QUEUE_KEY,[]);q.push(payload);store.set(QUEUE_KEY,q);
      if(S.screen==="result")set({saved:3},true);
    });
}
function flushQueue(){
  var q=store.get(QUEUE_KEY,[]);
  if(!q.length)return;
  var one=q[0];
  var body=JSON.stringify({fields:fsEncode(one).mapValue.fields});
  fetch(fsURL("/"+COLLECTION),{method:"POST",headers:{"Content-Type":"application/json"},body:body})
    .then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);
      q.shift();store.set(QUEUE_KEY,q);flushQueue();})
    .catch(function(){/* tetap antre, coba lagi kunjungan berikut */});
}

/* ===== Hitung mundur total 75 menit ===== */
function remainSec(){return Math.max(0,(S.deadline-Date.now())/1000);}
setInterval(function(){
  if(S.screen!=="game")return;
  var r=remainSec();
  var t=document.getElementById("tk-time"),bar=document.getElementById("tk-tfill");
  if(t){t.textContent="⏱ "+fmtClock(r);t.classList.toggle("warn",r<=300);}
  if(bar){bar.style.width=(r/TOTAL_TIME*100)+"%";bar.classList.toggle("warn",r<=300);}
  if(r<=0)finishGame(true);
},400);

      '<button class="tk-btn ghost" style="margin-top:0" data-act="discard">Buang &amp; Mulai Baru</button></div></div>';
  }
  h+='<p class="tk-sub">Setiap sesi diundi acak dari bank 59 soal: <b>15 Pilihan Ganda</b> + <b>10 Pilihan Ganda Kompleks</b> + <b>5 Benar/Salah</b>. Urutan soal dan urutan pilihan jawaban juga diacak. Jawaban masih bisa diubah sebelum dikumpulkan.</p>';
  h+='<div class="tk-label">Nama Siswa</div><input id="tk-nama" class="tk-input" type="text" maxlength="30" placeholder="Tulis namamu..." value="'+esc(S.nama)+'">';
  h+='<div class="tk-label">Kelas / Rombel</div><div class="tk-kelasrow">'+
    '<button class="tk-chip sel" type="button">Kelas IX</button>'+
    '<input id="tk-rombel" class="tk-input" type="text" maxlength="6" placeholder="mis. IX-A" value="'+esc(S.rombel)+'"></div>';
  h+='<div class="tk-label">Kecamatan</div><select id="tk-kecamatan" class="tk-input">'+
    '<option value="">— Pilih kecamatan —</option>'+
    KECAMATAN.map(function(k){return '<option value="'+k+'"'+(S.kecamatan===k?" selected":"")+">Kecamatan "+k+"</option>";}).join("")+"</select>";
  h+='<div class="tk-label">Nama Sekolah</div>'+schoolComboHTML();
  h+='<button class="tk-btn" data-act="start">Mulai Try Out</button>';
  h+='<div class="tk-menu-msg">'+(S.menuMsg?esc(S.menuMsg):"")+"</div>";
  h+='<p class="tk-foot">Soal sesuai kerangka asesmen TKA — Perkaban BSKAP No. 047/H/AN/2025.<br>Nilai tersimpan otomatis ke database kabupaten. Pastikan koneksi internet aktif saat mengerjakan.</p>';
  return h;
}

/* ===== Tampilan: Soal ===== */
function typeName(t){return t==="pg"?"Pilihan Ganda":t==="mcma"?"Pilihan Ganda Kompleks":"Benar / Salah";}
function questionHTML(){
  var it=S.items[S.cur],a=S.answers[S.cur];
  var r=remainSec();
  var h='<div class="tk-head"><span class="tk-mname">Soal '+(S.cur+1)+" dari "+TOTAL_Q+'</span>'+
    '<span class="tk-time'+(r<=300?" warn":"")+'" id="tk-time">⏱ '+fmtClock(r)+"</span></div>";
  h+='<div class="tk-tbar"><div class="tk-tfill'+(r<=300?" warn":"")+'" id="tk-tfill" style="width:'+(r/TOTAL_TIME*100)+'%"></div></div>';
  h+='<div class="tk-meta"><span>'+esc(it.cat)+'</span><span>Terjawab: '+doneCount()+"/"+TOTAL_Q+"</span></div>";
  h+='<div class="tk-cat">'+typeName(it.type)+"</div>";
  h+='<div class="tk-qtext">'+nl2br(it.text)+"</div>";
  if(it.img)h+='<img class="tk-qimg" src="'+esc(it.img)+'" alt="Gambar soal">';
  var letters=["A","B","C","D","E","F"];
  if(it.type==="pg"){
    h+='<div class="tk-type">Pilih satu jawaban yang paling tepat.</div>';
    h+=it.options.map(function(o,i){
      return '<button class="tk-opt'+(a===i?" sel":"")+'" data-act="pg" data-v="'+i+'"><span class="tk-letter">'+letters[i]+'</span><span class="tk-obody">'+esc(o.t)+"</span></button>";
    }).join("");
  }else if(it.type==="mcma"){
    h+='<div class="tk-type">⚠️ Pilihan ganda kompleks — pilih <b>semua</b> jawaban yang benar (bisa lebih dari satu).</div>';
    h+=it.options.map(function(o,i){
      var sel=a&&a.indexOf(i)>=0;
      return '<button class="tk-opt'+(sel?" sel":"")+'" data-act="mcma" data-v="'+i+'"><span class="tk-letter">'+(sel?"✓":letters[i])+'</span><span class="tk-obody">'+esc(o.t)+"</span></button>";
    }).join("");
  }else{
    h+='<div class="tk-type">Tentukan <b>Benar</b> atau <b>Salah</b> untuk setiap pernyataan.</div>';
    h+=it.statements.map(function(s,j){
      var v=a?a[j]:null;
      return '<div class="tk-katrow"><div class="tk-stmt"><b>('+(j+1)+")</b> "+esc(s)+'</div><div class="tk-bs">'+
        '<button data-act="kat" data-i="'+j+'" data-v="1" class="'+(v===true?"selB":"")+'">✔ Benar</button>'+
        '<button data-act="kat" data-i="'+j+'" data-v="0" class="'+(v===false?"selS":"")+'">✘ Salah</button></div></div>';
    }).join("");
  }
  h+='<div class="tk-navrow">'+
    '<button class="tk-btn ghost" data-act="prev"'+(S.cur===0?" disabled":"")+'>← Sebelumnya</button>'+
    (S.cur<TOTAL_Q-1
      ? '<button class="tk-btn" data-act="next" style="margin-top:0">Berikutnya →</button>'
      : '<button class="tk-btn" data-act="finish" style="margin-top:0">✔ Selesai &amp; Kumpulkan</button>')+
    "</div>";
  h+='<div class="tk-palabel">Palet Nomor Soal</div><div class="tk-pal">';
  h+=S.items.map(function(it2,i){
    var cls=(i===S.cur?"cur":"")+(isDone(it2,S.answers[i])?" done":"");
    return '<button class="'+cls+'" data-act="pal" data-v="'+i+'">'+(i+1)+"</button>";
  }).join("");
  h+="</div>";
  if(S.cur<TOTAL_Q-1)h+='<button class="tk-btn" data-act="finish">✔ Selesai &amp; Kumpulkan</button>';
  return h;
}
function modalHTML(){
  if(!S.confirmOpen)return "";
  var done=doneCount(),sisa=TOTAL_Q-done;
  return '<div class="tk-overlay"><div class="tk-modal"><h3>Kumpulkan jawaban?</h3>'+
    "<p>Kamu sudah menjawab <b>"+done+" dari "+TOTAL_Q+" soal</b>."+
    (sisa>0?" Masih ada <b>"+sisa+" soal</b> yang belum dijawab tuntas — soal itu akan dinilai dari jawaban yang ada (bisa 0 poin).":"")+
    "</p><p>Setelah dikumpulkan, jawaban tidak bisa diubah lagi.</p>"+
    '<div class="tk-navrow"><button class="tk-btn ghost" data-act="cancelFinish">Kembali</button>'+
    '<button class="tk-btn" data-act="confirmFinish" style="margin-top:0">Ya, Kumpulkan</button></div></div></div>';
}

/* ===== Tampilan: Hasil ===== */
function saveStatHTML(){
  if(S.saved===2)return '<p class="tk-savestat ok">✅ Nilai tersimpan di database</p>';
  if(S.saved===1)return '<p class="tk-savestat wait">⏳ Menyimpan nilai...</p>';
  if(S.saved===3)return '<p class="tk-savestat fail">⚠️ Nilai belum terkirim — tersimpan di HP ini dan akan dikirim otomatis saat ada koneksi</p>';
  return "";
}
function resultHTML(){
  var r=S.result,d=r.d;
  var msg;
  if(r.nilai>=90)msg="Luar biasa! Kamu siap menghadapi TKA!";
  else if(r.nilai>=75)msg="Hebat! Sedikit lagi sempurna.";
  else if(r.nilai>=55)msg="Bagus! Terus berlatih pada soal yang belum dikuasai.";
  else msg="Jangan menyerah — pelajari lagi materinya dan coba lagi ya!";
  var h='<h2 class="tk-title">Selesai!</h2><p class="tk-msg">'+msg+"</p>";
  if(r.auto)h+='<p class="tk-msg">⏰ Waktu 75 menit habis — sesi diselesaikan otomatis dan dinilai dari jawaban yang ada.</p>';
  h+='<div class="tk-namecard">👤 '+esc(S.nama)+" &bull; Kelas "+esc(kelasStr())+"<br><span>"+esc(S.sekolah)+" — Kec. "+esc(S.kecamatan)+"</span></div>";
  h+=saveStatHTML();
  h+='<div class="tk-big">'+fmtNilai(r.nilai)+"</div>";
  h+='<p class="tk-msg">Nilai akhir (skala 0–100)</p>';
  h+='<div class="tk-stats">';
  h+='<div class="tk-stat"><b>'+d.pg+"/15</b><span>Pilihan Ganda benar</span></div>";
  h+='<div class="tk-stat"><b>'+d.mcma+"/10</b><span>PG Kompleks benar (persis)</span></div>";
  h+='<div class="tk-stat"><b>'+d.bsStmt+"/15</b><span>Pernyataan Benar/Salah tepat ("+d.bsFull+"/5 soal penuh)</span></div>";
  h+='<div class="tk-stat"><b>'+fmtPoin(r.poin)+"/82,5</b><span>Total poin</span></div>";
  h+='<div class="tk-stat"><b>'+fmtDur(r.durasi)+'</b><span>Waktu tempuh</span></div>';
  h+='<div class="tk-stat"><b>'+d.full+"/30</b><span>Soal bernilai penuh</span></div>";
  h+="</div>";
  h+=reviewHTML();
  h+='<button class="tk-btn" data-act="copy">'+(S.copied?"✅ Hasil Tersalin!":"📋 Salin Hasil")+"</button>";
  h+='<button class="tk-btn ghost" data-act="again">↻ Kerjakan Lagi (Soal Baru Diundi)</button>';
  h+='<button class="tk-btn ghost" data-act="menu">Kembali ke Menu</button>';
  return h;
}
function fmtAns(it,a){
  var letters=["A","B","C","D","E","F"];
  if(it.type==="pg")return a==null?"—":letters[a];
  if(it.type==="mcma")return (!a||!a.length)?"—":a.map(function(i){return letters[i];}).join(", ");
  return a.map(function(v,j){return "("+(j+1)+") "+(v===null?"—":(v?"Benar":"Salah"));}).join(" · ");
}
function fmtKey(it){
  var letters=["A","B","C","D","E","F"];
  if(it.type==="pg"){
    var k=-1;it.options.forEach(function(o,i){if(o.ok)k=i;});
    return letters[k];
  }
  if(it.type==="mcma"){
    var ks=[];it.options.forEach(function(o,i){if(o.ok)ks.push(letters[i]);});
    return ks.join(", ");
  }
  return it.key.map(function(v,j){return "("+(j+1)+") "+(v?"Benar":"Salah");}).join(" · ");
}
function isFull(it,a){
  if(it.type==="pg")return a!==null&&it.options[a].ok;
  if(it.type==="mcma"){
    var correct=[];it.options.forEach(function(o,j){if(o.ok)correct.push(j);});
    return !!(a&&a.length===correct.length&&correct.every(function(k){return a.indexOf(k)>=0;}));
  }
  return !!(a&&a.every(function(v,j){return v===it.key[j];}));
}
function reviewHTML(){
  var h='<div class="tk-rev"><h3>📝 Rincian Jawaban &amp; Pembahasan</h3>';
  h+=S.items.map(function(it,i){
    var a=S.answers?S.answers[i]:null;
    var ok=isFull(it,a);
    return '<div class="tk-revitem '+(ok?"ok":"bad")+'">'+
      '<div class="tk-rhead">'+(ok?"✅":"❌")+" Soal "+(i+1)+" — "+typeName(it.type)+" &bull; "+esc(it.cat)+"</div>"+
      '<div class="tk-rq">'+nl2br(it.text)+"</div>"+
      (it.img?'<img class="tk-qimg" src="'+esc(it.img)+'" alt="Gambar soal">':"")+
      '<div class="tk-rans">Jawabanmu: <b class="'+(ok?"ok":"bad")+'">'+fmtAns(it,a)+"</b> &nbsp;|&nbsp; Kunci: <b>"+fmtKey(it)+"</b></div>"+
      (it.sol?'<div class="tk-rsol"><b>Pembahasan:</b><br>'+nl2br(it.sol)+"</div>":"")+
      "</div>";
  }).join("");
  return h+"</div>";
}
function copyText(){
  var r=S.result,d=r.d;
  var txt="🏆 Try Out TKA Matematika SMP 2027 — Kabupaten Pacitan\n"+
    "Nama: "+S.nama.trim()+"\n"+
    "Kelas: "+kelasStr()+"\n"+
    "Sekolah: "+S.sekolah+"\n"+
    "Kecamatan: "+(S.kecamatan||"")+"\n"+
    "Nilai: "+fmtNilai(r.nilai)+"\n"+
    "Benar — PG: "+d.pg+"/15 • MCMA: "+d.mcma+"/10 • Benar/Salah: "+d.bsStmt+"/15 pernyataan\n"+
    "Waktu: "+fmtDur(r.durasi);
  function done(){set({copied:true},true);setTimeout(function(){if(S.screen==="result")set({copied:false},true);},2200);}
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done).catch(function(){fallback();});
  }else fallback();
  function fallback(){
    var ta=document.createElement("textarea");
    ta.value=txt;ta.style.position="fixed";ta.style.opacity="0";
    document.body.appendChild(ta);ta.select();
    try{document.execCommand("copy");}catch(e){}
    document.body.removeChild(ta);done();
  }
}

/* ===== Render & peristiwa ===== */
function render(){
  var body=document.getElementById("tk-body");
  if(S.screen==="menu"){body.innerHTML=menuHTML();bindSchoolCombo();bindMenuExtras();}
  else if(S.screen==="game")body.innerHTML=questionHTML();
  else body.innerHTML=resultHTML();
  document.getElementById("tk-modal-root").innerHTML=(S.screen==="game")?modalHTML():"";
}
function bindMenuExtras(){
  var kc=document.getElementById("tk-kecamatan");
  if(kc)kc.addEventListener("change",function(){syncMenuInputs();S.sekolah="";S.npsn="";save();render();});
}
document.addEventListener("click",function(e){
  if(!e.target.closest("#tk-sdd"))hideSchoolList();
});
document.getElementById("tk-body").addEventListener("click",function(e){
  var el=e.target.closest("[data-act]");if(!el||el.disabled)return;
  var act=el.getAttribute("data-act"),v=el.getAttribute("data-v");
  if(act==="start")startGame();
  else if(act==="resume")set({screen:"game"});
  else if(act==="discard"){
    var now=Date.now();
    set({screen:"menu",items:null,answers:null,cur:0,startAt:0,deadline:0,result:null,saved:0,menuMsg:null});
  }
  else if(act==="pg"){var a=S.answers.slice();a[S.cur]=parseInt(v,10);set({answers:a},true);}
  else if(act==="mcma"){
    var a2=S.answers.slice();var cur=a2[S.cur].slice();var iv=parseInt(v,10);
    var ix=cur.indexOf(iv);if(ix>=0)cur.splice(ix,1);else cur.push(iv);
    cur.sort(function(x,y){return x-y;});a2[S.cur]=cur;set({answers:a2},true);
  }
  else if(act==="kat"){
    var a3=S.answers.slice();var row=a3[S.cur].slice();
    row[parseInt(el.getAttribute("data-i"),10)]=(v==="1");
    a3[S.cur]=row;set({answers:a3},true);
  }
  else if(act==="pal")set({cur:parseInt(v,10)});
  else if(act==="prev")set({cur:Math.max(0,S.cur-1)});
  else if(act==="next")set({cur:Math.min(TOTAL_Q-1,S.cur+1)});
  else if(act==="finish")set({confirmOpen:true},true);
  else if(act==="again"){
    var now2=Date.now();var items=drawSession();
    set({screen:"game",items:items,answers:blankAnswers(items),cur:0,startAt:now2,
      deadline:now2+TOTAL_TIME*1000,result:null,saved:0,confirmOpen:false,copied:false});
    window.scrollTo(0,0);
  }
  else if(act==="menu")set({screen:"menu",confirmOpen:false,menuMsg:null,items:null,answers:null,cur:0,startAt:0,deadline:0,result:null,saved:0});
  else if(act==="copy")copyText();
});
document.getElementById("tk-modal-root").addEventListener("click",function(e){
  var el=e.target.closest("[data-act]");if(!el)return;
  var act=el.getAttribute("data-act");
  if(act==="cancelFinish")set({confirmOpen:false},true);
  else if(act==="confirmFinish")finishGame(false);
});
/* Bila halaman dimuat ulang saat sesi berjalan, tawarkan lanjutkan sesi di menu.
   Bila waktu sudah habis saat halaman tidak dibuka, selesaikan saat dimuat. */
flushQueue();
if(S.screen==="game"&&S.items&&S.deadline&&remainSec()>0){S.screen="menu";save();render();}
else if(S.screen==="game"&&remainSec()<=0)finishGame(true);
else render();
})();
</script>
</body>
</html>
