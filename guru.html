<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Halaman Guru — Try Out TKA Matematika SMP 2027</title>
<style>
:root{
  --bg:#f1f2f6; --surface:#ffffff; --surface-muted:#eef0f4;
  --text:#1c1c22; --muted:#6b6b76; --border:#e0e2e9;
  --accent:#4f46e5; --on-accent:#ffffff; --focus:#4f46e5;
  --shadow:rgba(20,20,40,.10); --ok:#1f9d63; --bad:#e5484d;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0b0b10; --surface:#17171d; --surface-muted:#23232c;
    --text:#f4f4f6; --muted:#a2a2b0; --border:#34343e;
    --accent:#818cf8; --on-accent:#0b0b10; --focus:#818cf8;
    --shadow:rgba(0,0,0,.45);
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  min-height:100vh;display:flex;flex-direction:column;align-items:center;
  padding:24px 16px}
#tk-root{width:100%;max-width:780px}
.tk-card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:22px;box-shadow:0 4px 18px var(--shadow)}
.tk-title{font-size:24px;font-weight:800;text-align:center;margin:0 0 4px}
.tk-sub{text-align:center;color:var(--muted);font-size:13.5px;margin:0 0 6px;line-height:1.55}
.tk-label{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:16px 0 8px}
.tk-input{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--border);background:var(--surface-muted);color:var(--text);font-size:15px;font-weight:600}
.tk-input:focus{outline:2px solid var(--focus);outline-offset:1px;border-color:var(--accent)}
.tk-dd{position:relative}
.tk-ddlist{position:absolute;top:100%;left:0;right:0;max-height:260px;overflow-y:auto;background:var(--surface);border:1.5px solid var(--border);border-radius:12px;margin-top:4px;z-index:60;display:none;box-shadow:0 8px 24px var(--shadow)}
.tk-dditem{padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--border)}
.tk-dditem:last-child{border-bottom:none}
.tk-dditem b{display:block;font-size:14px}
.tk-dditem span{font-size:11px;color:var(--muted)}
.tk-ddempty{padding:14px;text-align:center;color:var(--muted);font-size:13px}
.tk-row{display:flex;flex-wrap:wrap;gap:8px}
.tk-chip{flex:1 1 0;padding:11px 6px;border-radius:12px;border:1.5px solid var(--border);background:var(--surface-muted);color:var(--text);font-size:14px;font-weight:700;cursor:pointer;text-align:center}
.tk-chip.sel{border-color:var(--accent);background:var(--accent);color:var(--on-accent)}
.tk-kelasrow{display:flex;gap:8px}
.tk-kelasrow .tk-chip{flex:1}
.tk-kelasrow .tk-input{flex:0 0 110px}
.tk-materi{display:block;width:100%;text-align:left;padding:14px 16px;border-radius:14px;border:1.5px solid var(--border);background:var(--surface-muted);color:var(--text);margin:8px 0;cursor:pointer}
.tk-materi b{font-size:16px;display:block;line-height:1.35}
.tk-materi span{display:block;font-size:12px;color:var(--muted);margin-top:3px;line-height:1.45}
.tk-materi .tk-best{font-size:12px;font-weight:800;color:var(--ok);margin-top:5px}
.tk-materi.sel{border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 1.5px var(--accent)}
.tk-btn{width:100%;padding:14px;border:none;border-radius:14px;background:var(--accent);color:var(--on-accent);font-size:16px;font-weight:800;cursor:pointer;margin-top:18px}
.tk-btn.ghost{background:var(--surface-muted);color:var(--text);border:1px solid var(--border);font-size:14px;font-weight:700}
.tk-btn:disabled{opacity:.45;cursor:not-allowed}
.tk-menu-msg{min-height:20px;text-align:center;font-weight:700;font-size:13px;color:var(--bad);margin-top:10px}
.tk-credit{text-align:center;color:var(--muted);font-size:12px;font-weight:600;margin:12px 0 0}
.tk-foot{margin-top:16px;font-size:12px;color:var(--muted);text-align:center;line-height:1.6}
/* ===== Layar soal ===== */
.tk-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.tk-head .tk-mname{font-weight:800;font-size:16px}
.tk-time{font-weight:800;font-size:15px;background:var(--surface-muted);border:1px solid var(--border);border-radius:99px;padding:5px 14px}
.tk-time.warn{color:var(--bad);border-color:var(--bad)}
.tk-tbar{height:7px;background:var(--surface-muted);border-radius:99px;overflow:hidden;margin:8px 0 4px}
.tk-tfill{height:100%;background:var(--accent);border-radius:99px;transition:width .5s linear}
.tk-tfill.warn{background:var(--bad)}
.tk-meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:10px}
.tk-q{font-size:16.5px;line-height:1.65}
.tk-q p{margin:0 0 10px}
.tk-img{max-width:100%;height:auto;display:block;margin:10px auto;border-radius:10px;background:#fff;padding:6px;border:1px solid var(--border)}
.tk-tabel{border-collapse:collapse;margin:10px auto;font-size:15px;max-width:100%}
.tk-tabel th,.tk-tabel td{border:1px solid var(--border);padding:6px 12px;text-align:center}
.tk-tabel th{background:var(--surface-muted);font-weight:700}
.tk-hint{font-size:13px;color:var(--muted);font-weight:700;margin:14px 0 2px}
.tk-opt{display:flex;align-items:flex-start;gap:11px;width:100%;text-align:left;padding:12px 14px;margin:8px 0;border-radius:12px;border:1.5px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;font-size:15.5px;line-height:1.5}
.tk-opt .tk-letter{flex:0 0 auto;width:27px;height:27px;border-radius:50%;border:2px solid var(--muted);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;margin-top:0}
.tk-opt.sel{border-color:var(--accent);background:var(--surface-muted)}
.tk-opt.sel .tk-letter{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.tk-opt .tk-obody{flex:1}
.tk-katrow{border:1.5px solid var(--border);border-radius:12px;padding:12px 14px;margin:8px 0}
.tk-katrow .tk-stmt{font-size:15.5px;line-height:1.55;margin-bottom:10px}
.tk-bs{display:flex;gap:8px}
.tk-bs button{flex:1;padding:9px;border-radius:10px;border:1.5px solid var(--border);background:var(--surface-muted);color:var(--text);font-weight:800;font-size:14px;cursor:pointer}
.tk-bs button.selB{background:var(--ok);border-color:var(--ok);color:#fff}
.tk-bs button.selS{background:var(--bad);border-color:var(--bad);color:#fff}
.tk-navrow{display:flex;gap:8px;margin-top:16px}
.tk-navrow .tk-btn{margin-top:0;flex:1;padding:12px;font-size:14.5px}
.tk-pal{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;margin-top:10px}
.tk-pal button{padding:8px 0;border-radius:9px;border:1.5px solid var(--border);background:var(--surface-muted);color:var(--text);font-weight:700;cursor:pointer;font-size:13px}
.tk-pal button.done{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.tk-pal button.cur{outline:2px solid var(--accent);outline-offset:1px}
@media (max-width:560px){.tk-pal{grid-template-columns:repeat(6,1fr)}}
.tk-palabel{font-size:12px;color:var(--muted);font-weight:700;margin-top:18px;text-transform:uppercase;letter-spacing:.06em}
/* ===== Hasil ===== */
.tk-big{font-size:56px;font-weight:800;text-align:center;margin:4px 0}
.tk-msg{text-align:center;color:var(--muted);font-size:14.5px;margin:0 0 4px;line-height:1.55}
.tk-namecard{text-align:center;background:var(--surface-muted);border-radius:12px;padding:11px;margin:12px 0 4px;font-size:15px;font-weight:700;line-height:1.5}
.tk-namecard span{font-size:12px;font-weight:600;color:var(--muted)}
.tk-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0 4px}
.tk-stat{background:var(--surface-muted);border-radius:12px;padding:12px;text-align:center}
.tk-stat b{font-size:19px;display:block}
.tk-stat span{font-size:11.5px;color:var(--muted);line-height:1.4;display:block;margin-top:2px}
.tk-savestat{text-align:center;font-size:13px;font-weight:700;margin:8px 0 0}
.tk-savestat.ok{color:var(--ok)}.tk-savestat.wait{color:var(--muted)}.tk-savestat.fail{color:var(--bad)}
/* ===== Modal konfirmasi ===== */
.tk-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:200;padding:16px}
.tk-modal{background:var(--surface);color:var(--text);border-radius:16px;padding:22px;max-width:430px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.35)}
.tk-modal h3{margin:0 0 8px;font-size:18px}
.tk-modal p{margin:0 0 6px;font-size:14.5px;line-height:1.6;color:var(--muted)}
button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.tk-rev{margin-top:20px;text-align:left}
.tk-rev h3{font-size:16px;margin:0 0 6px}
.tk-revitem{border:1.5px solid var(--border);border-radius:12px;padding:12px 14px;margin:10px 0}
.tk-revitem.ok{border-color:var(--ok)}
.tk-revitem.bad{border-color:var(--bad)}
.tk-revitem .tk-rhead{font-weight:800;font-size:14px;margin-bottom:6px}
.tk-revitem .tk-rq{font-size:14.5px;line-height:1.55}
.tk-revitem .tk-rans{font-size:14px;line-height:1.55;margin-top:8px}
.tk-revitem .tk-rsol{font-size:13.5px;line-height:1.6;color:var(--muted);margin-top:6px}
.tk-revitem .tk-rans b.ok{color:var(--ok)}
.tk-revitem .tk-rans b.bad{color:var(--bad)}
</style>
<style>
.tk-foot-credit{text-align:center;color:var(--muted);font-size:12.5px;font-weight:600;margin:14px 0 4px;line-height:1.6}
.tk-foot-credit a{color:var(--accent);text-decoration:none;font-weight:800}
.tk-foot-credit a:hover{text-decoration:underline}
.tk-creditline{text-align:center;color:var(--muted);font-size:12.5px;font-weight:600;margin:2px 0 0}
.tk-creditline a{color:var(--accent);text-decoration:none;font-weight:800}
.g-wrap{width:100%;max-width:1080px;margin:0 auto}
.g-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
.g-tab{padding:10px 16px;border-radius:99px;border:1.5px solid var(--border);background:var(--surface-muted);color:var(--text);font-weight:700;font-size:14px;cursor:pointer}
.g-tab.sel{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.g-filters{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.g-filters .tk-input{flex:1 1 160px}
.g-tablewrap{overflow-x:auto}
table.g-table{border-collapse:collapse;width:100%;font-size:14px;margin-top:8px}
.g-table th,.g-table td{border:1px solid var(--border);padding:8px 10px;text-align:left;white-space:nowrap}
.g-table th{background:var(--surface-muted);font-weight:800}
.g-table td.num,.g-table th.num{text-align:right}
.g-table tr.me{background:var(--surface-muted)}
.g-empty{text-align:center;color:var(--muted);padding:26px 10px;font-size:14px;line-height:1.6}
.g-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:12px 0}
.g-card2{background:var(--surface-muted);border:1px solid var(--border);border-radius:14px;padding:14px;text-align:center}
.g-card2 b{display:block;font-size:22px}
.g-card2 span{font-size:12.5px;color:var(--muted);font-weight:700}
.g-scope{font-size:13.5px;color:var(--muted);text-align:center;line-height:1.6}
.g-scope b{color:var(--text)}
</style>
</head>

/* ===== Firestore REST: baca ===== */
function fsDecode(f){
  if(!f)return null;
  if(f.stringValue!==undefined)return f.stringValue;
  if(f.integerValue!==undefined)return Number(f.integerValue);
  if(f.doubleValue!==undefined)return f.doubleValue;
  if(f.booleanValue!==undefined)return f.booleanValue;
  if(f.timestampValue!==undefined)return f.timestampValue;
  if(f.arrayValue!==undefined)return (f.arrayValue.values||[]).map(fsDecode);
  if(f.mapValue!==undefined){var o={};var fl=f.mapValue.fields||{};for(var k in fl)o[k]=fsDecode(fl[k]);return o;}
  if(f.nullValue!==undefined)return null;
  return null;
}
function fsURL(path){return "https://firestore.googleapis.com/v1/projects/"+PROJECT+"/databases/(default)/documents"+path+"?key="+API_KEY;}
function loadRows(){
  G.loading=true;G.loadErr="";render();
  var all=[],pageToken="";
  function page(){
    var url=fsURL("/"+COLLECTION)+"?pageSize=1000"+(pageToken?"&pageToken="+encodeURIComponent(pageToken):"");
    return fetch(url).then(function(r){
      if(!r.ok)throw new Error("HTTP "+r.status);
      return r.json();
    }).then(function(j){
      (j.documents||[]).forEach(function(doc){
        var r={};var fl=doc.fields||{};
        for(var k in fl)r[k]=fsDecode(fl[k]);
        all.push(r);
      });
      pageToken=j.nextPageToken||"";
      if(pageToken&&all.length<5000)return page();
      G.rows=all;G.loading=false;render();
    }).catch(function(e){
      G.loading=false;G.loadErr="Gagal memuat data ("+e.message+"). Periksa koneksi internet lalu tekan Muat Ulang.";
      render();
    });
  }
  page();
}
function scopedRows(){
  var rows=G.rows;
  if(G.mode==="npsn")rows=rows.filter(function(r){return String(r.npsn||"")===String(G.npsn);});
  if(G.kecFilter)rows=rows.filter(function(r){return r.kecamatan===G.kecFilter;});
  if(G.sekFilter)rows=rows.filter(function(r){return (r.sekolah||"").toLowerCase().indexOf(G.sekFilter.toLowerCase())>=0;});
  if(G.namaSearch)rows=rows.filter(function(r){return (r.nama||"").toLowerCase().indexOf(G.namaSearch.toLowerCase())>=0;});
  return rows;
}
function bestPerStudent(rows){
  var map={};
  rows.forEach(function(r){
    var k=studentKey(r);
    if(!map[k]||num(r.skor)>num(map[k].skor))map[k]=r;
    map[k]._n=(map[k]._n||0)+1;
  });
  var list=Object.keys(map).map(function(k){return map[k];});
  list.sort(function(a,b){return num(b.skor)-num(a.skor);});
  return list;
}

/* ===== CSV (titik koma + BOM, mengikuti filter aktif) ===== */
function csvCell(v){
  var s=String(v==null?"":v);
  if(/[;\n"]/.test(s))s='"'+s.replace(/"/g,'""')+'"';
  return s;
}
function downloadCSV(){
  var tab=G.tab,header=[],data=[];
  if(tab==="matriks"){
    header=["Nama","Kelas","Sekolah","Kecamatan","Skor Terbaik","Jumlah Percobaan"];
    data=bestPerStudent(scopedRows()).map(function(r){
      return[r.nama,(r.kelas||"")+" "+(r.rombel||""),r.sekolah,r.kecamatan,fmtNilai(num(r.skor)),r._n||1];
    });
  }else if(tab==="peringkat"){
    header=["Peringkat","Nama","Kelas","Sekolah","Kecamatan","Skor Terbaik"];
    var rank=0,prev=null;
    data=bestPerStudent(scopedRows()).map(function(r,i){
      if(prev===null||num(r.skor)!==prev)rank=i+1;prev=num(r.skor);
      return[rank,r.nama,(r.kelas||"")+" "+(r.rombel||""),r.sekolah,r.kecamatan,fmtNilai(num(r.skor))];
    });
  }else if(tab==="percobaan"){
    header=["Waktu","Nama","Kelas","Sekolah","Kecamatan","Skor","Benar","Durasi (detik)"];
    data=scopedRows().slice().sort(function(a,b){return String(b.createdAt||"").localeCompare(String(a.createdAt||""));}).map(function(r){
      return[fmtWaktu(r.createdAt),r.nama,(r.kelas||"")+" "+(r.rombel||""),r.sekolah,r.kecamatan,fmtNilai(num(r.skor)),r.benar,Math.round(num(r.durasi))];
    });
  }else{
    header=["Kecamatan","Peserta","Percobaan","Rata-rata"];
    data=rekapKecamatan().map(function(x){return[x.kec,x.peserta,x.percobaan,fmtNilai(x.rata)];});
  }
  var csv="﻿"+header.map(csvCell).join(";")+"\n"+data.map(function(row){return row.map(csvCell).join(";");}).join("\n");
  var blob=new Blob([csv],{type:"text/csv;charset=utf-8"});
  var a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="rekap-tka-matematika-2027-"+tab+".csv";
  document.body.appendChild(a);a.click();document.body.removeChild(a);
}
function rekapKecamatan(){
  var rows=scopedRows();
  var m={};
  rows.forEach(function(r){
    var k=r.kecamatan||"-";
    m[k]=m[k]||{kec:k,peserta:{},percobaan:0,total:0};
    m[k].peserta[studentKey(r)]=1;m[k].percobaan++;m[k].total+=num(r.skor);
  });
  return Object.keys(m).sort().map(function(k){
    var x=m[k];
    return{kec:k,peserta:Object.keys(x.peserta).length,percobaan:x.percobaan,rata:x.percobaan?x.total/x.percobaan:0};
  });
}

  return '<h2 class="tk-title">Halaman Guru</h2>'+
    '<p class="tk-sub"><b>Try Out TKA Matematika SMP 2027</b> — Kabupaten Pacitan</p>'+
    '<p class="tk-creditline">Design by <a href="https://rasa.web.id" target="_blank" rel="noopener">rasa.web.id</a></p>'+
    '<div class="tk-label">PIN / NPSN</div>'+
    '<input id="g-pin" class="tk-input" type="password" inputmode="numeric" placeholder="Masukkan PIN master atau NPSN sekolah" autocomplete="off">'+
    '<button class="tk-btn" data-act="login">Masuk</button>'+
    '<div class="tk-menu-msg" id="g-err"></div>'+
    '<p class="tk-foot">Guru masuk dengan PIN master, atau dengan NPSN sekolah (hanya melihat nilai sekolah sendiri).</p>';
}
function filtersHTML(){
  var h='<div class="g-filters">';
  h+='<select id="g-kec" class="tk-input"><option value="">Semua Kecamatan</option>'+
    KECAMATAN.map(function(k){return '<option value="'+k+'"'+(G.kecFilter===k?" selected":"")+">"+k+"</option>";}).join("")+"</select>";
  if(G.mode==="master"){
    h+='<input id="g-sek" class="tk-input" type="text" placeholder="Cari sekolah..." value="'+esc(G.sekFilter)+'">';
  }
  h+='<input id="g-nama" class="tk-input" type="text" placeholder="Cari nama siswa..." value="'+esc(G.namaSearch)+'">';
  h+='<button class="tk-btn sm" data-act="csv" style="flex:0 0 auto">⬇ Unduh CSV</button>';
  h+='<button class="tk-btn sm ghost" data-act="reload" style="flex:0 0 auto">↻ Muat Ulang</button>';
  h+='<button class="tk-btn sm ghost" data-act="logout" style="flex:0 0 auto">Keluar</button>';
  h+='</div>';
  return h;
}
function matriksHTML(){
  var list=bestPerStudent(scopedRows());
  var h='<p class="tk-sub">Setiap baris adalah satu siswa dengan <b>skor terbaiknya</b>. Tombol Unduh CSV mengunduh tabel ini mengikuti filter yang aktif.</p>';
  if(!list.length)return h+'<div class="g-empty">Belum ada data yang cocok dengan filter.</div>';
  h+='<div class="g-tablewrap"><table class="g-table"><thead><tr><th>Nama</th><th>Kelas</th><th>Sekolah</th><th>Kecamatan</th><th class="num">Skor Terbaik</th><th class="num">Percobaan</th></tr></thead><tbody>';
  list.forEach(function(r){
    h+='<tr><td>'+esc(r.nama)+'</td><td>'+esc((r.kelas||"")+" "+(r.rombel||""))+'</td><td>'+esc(r.sekolah)+'</td><td>'+esc(r.kecamatan)+'</td><td class="num"><b>'+fmtNilai(num(r.skor))+'</b></td><td class="num">'+(r._n||1)+'</td></tr>';
  });
  return h+'</tbody></table></div>';
}
function peringkatHTML(){
  var list=bestPerStudent(scopedRows());
  var h='<p class="tk-sub">Peringkat berdasarkan skor terbaik tiap siswa (nilai sama = peringkat sama).</p>';
  if(!list.length)return h+'<div class="g-empty">Belum ada data yang cocok dengan filter.</div>';
  h+='<div class="g-tablewrap"><table class="g-table"><thead><tr><th class="num">Peringkat</th><th>Nama</th><th>Kelas</th><th>Sekolah</th><th>Kecamatan</th><th class="num">Skor</th></tr></thead><tbody>';
  var rank=0,prev=null,shown=0;
  list.forEach(function(r,i){
    if(prev===null||num(r.skor)!==prev)rank=i+1;prev=num(r.skor);
    if(!G.showAll&&i>=100)return;
    shown++;
    var medal=rank===1?"🥇 ":rank===2?"🥈 ":rank===3?"🥉 ":"";
    h+='<tr><td class="num">'+medal+rank+'</td><td>'+esc(r.nama)+'</td><td>'+esc((r.kelas||"")+" "+(r.rombel||""))+'</td><td>'+esc(r.sekolah)+'</td><td>'+esc(r.kecamatan)+'</td><td class="num"><b>'+fmtNilai(num(r.skor))+'</b></td></tr>';
  });
  h+='</tbody></table></div>';
  if(!G.showAll&&list.length>100)h+='<button class="tk-btn ghost" data-act="more">Tampilkan lebih banyak ('+(list.length-100)+' lagi)</button>';
  return h;
}
function percobaanHTML(){
  var rows=scopedRows().slice().sort(function(a,b){return String(b.createdAt||"").localeCompare(String(a.createdAt||""));});
  var h='<p class="tk-sub">Semua percobaan (termasuk pengulangan), terbaru di atas.</p>';
  if(!rows.length)return h+'<div class="g-empty">Belum ada data yang cocok dengan filter.</div>';
  h+='<div class="g-tablewrap"><table class="g-table"><thead><tr><th>Waktu</th><th>Nama</th><th>Kelas</th><th>Sekolah</th><th>Kecamatan</th><th class="num">Skor</th><th class="num">Benar</th><th>Durasi</th></tr></thead><tbody>';
  rows.forEach(function(r){
    h+='<tr><td>'+fmtWaktu(r.createdAt)+'</td><td>'+esc(r.nama)+'</td><td>'+esc((r.kelas||"")+" "+(r.rombel||""))+'</td><td>'+esc(r.sekolah)+'</td><td>'+esc(r.kecamatan)+'</td><td class="num"><b>'+fmtNilai(num(r.skor))+'</b></td><td class="num">'+num(r.benar)+'/30</td><td>'+fmtDur(num(r.durasi))+'</td></tr>';
  });
  return h+'</tbody></table></div>';
}
function rekapHTML(){
  var rows=scopedRows();
  var peserta={};var sekolah={};var total=0,maks=0,min=100;
  rows.forEach(function(r){
    peserta[studentKey(r)]=1;sekolah[(r.sekolah||"").toLowerCase()]=1;
    total+=num(r.skor);if(num(r.skor)>maks)maks=num(r.skor);if(num(r.skor)<min)min=num(r.skor);
  });
  var nP=Object.keys(peserta).length;
  var dist={"< 55":0,"55–69":0,"70–84":0,"≥ 85":0};
  bestPerStudent(rows).forEach(function(r){
    var s=num(r.skor);
    if(s<55)dist["< 55"]++;else if(s<70)dist["55–69"]++;else if(s<85)dist["70–84"]++;else dist["≥ 85"]++;
  });
  var h='<div class="g-cards">';
  h+='<div class="g-card2"><b>'+nP+'</b><span>Peserta</span></div>';
  h+='<div class="g-card2"><b>'+rows.length+'</b><span>Percobaan</span></div>';
  h+='<div class="g-card2"><b>'+Object.keys(sekolah).length+'</b><span>Sekolah Ikut</span></div>';
  h+='<div class="g-card2"><b>'+fmtNilai(rows.length?total/rows.length:0)+'</b><span>Rata-rata Skor</span></div>';
  h+='<div class="g-card2"><b>'+(rows.length?fmtNilai(maks):"—")+'</b><span>Skor Tertinggi</span></div>';
  h+='<div class="g-card2"><b>'+(rows.length?fmtNilai(min):"—")+'</b><span>Skor Terendah</span></div>';
  h+='</div>';
  h+='<div class="tk-label">Sebaran Nilai (skor terbaik tiap siswa)</div>';
  h+='<div class="g-tablewrap"><table class="g-table"><thead><tr><th>Rentang Nilai</th><th class="num">Jumlah Siswa</th></tr></thead><tbody>';
  Object.keys(dist).forEach(function(k){h+='<tr><td>'+k+'</td><td class="num">'+dist[k]+'</td></tr>';});
  h+='</tbody></table></div>';
  h+='<div class="tk-label">Rata-rata per Kecamatan</div>';
  var rk=rekapKecamatan();
  if(!rk.length)return h+'<div class="g-empty">Belum ada data.</div>';
  h+='<div class="g-tablewrap"><table class="g-table"><thead><tr><th>Kecamatan</th><th class="num">Peserta</th><th class="num">Percobaan</th><th class="num">Rata-rata</th></tr></thead><tbody>';
  rk.forEach(function(x){h+='<tr><td>'+esc(x.kec)+'</td><td class="num">'+x.peserta+'</td><td class="num">'+x.percobaan+'</td><td class="num"><b>'+fmtNilai(x.rata)+'</b></td></tr>';});
  return h+'</tbody></table></div>';
}
function dashHTML(){
  var scope=G.mode==="master"
    ?'Masuk sebagai <b>Guru Kabupaten</b> — melihat semua sekolah.'
    :'Masuk sebagai <b>'+esc(G.sekolah)+'</b> (NPSN '+esc(G.npsn)+') — hanya nilai sekolah ini.';
  var h='<h2 class="tk-title">Halaman Guru</h2>'+
    '<p class="tk-sub"><b>Try Out TKA Matematika SMP 2027</b> — Kabupaten Pacitan</p>'+
    '<p class="g-scope">'+scope+'<br>'+(G.loading?"⏳ Memuat data...":("Total percobaan termuat: <b>"+G.rows.length+"</b>"))+"</p>";
  if(G.loadErr)h+='<div class="tk-warnbox">'+esc(G.loadErr)+"</div>";
  h+='<div class="g-tabs">'+
    [["matriks","Matriks Nilai"],["peringkat","Peringkat"],["percobaan","Semua Percobaan"],["rekap","Rekap Kabupaten"]].map(function(t){
      return '<button class="g-tab'+(G.tab===t[0]?" sel":"")+'" data-act="tab" data-v="'+t[0]+'">'+t[1]+"</button>";
    }).join("")+"</div>";
  h+=filtersHTML();
  if(G.tab==="matriks")h+=matriksHTML();
  else if(G.tab==="peringkat")h+=peringkatHTML();
  else if(G.tab==="percobaan")h+=percobaanHTML();
  else h+=rekapHTML();
  return h;
}
function render(){
  document.getElementById("g-body").innerHTML=G.authed?dashHTML():loginHTML();
  var kc=document.getElementById("g-kec");
  if(kc)kc.addEventListener("change",function(){G.kecFilter=kc.value;render();});
  var sk=document.getElementById("g-sek");
  if(sk)sk.addEventListener("input",function(){G.sekFilter=sk.value;render();});
  var nm=document.getElementById("g-nama");
  if(nm)nm.addEventListener("input",function(){G.namaSearch=nm.value;render();});
  var pin=document.getElementById("g-pin");
  if(pin)pin.addEventListener("keydown",function(e){if(e.key==="Enter")doLogin();});
}
function doLogin(){
  var pin=document.getElementById("g-pin");
  var v=pin?pin.value.trim():"";
  var err=document.getElementById("g-err");
  function fail(m){if(err)err.textContent=m;if(pin)pin.value="";if(pin)pin.focus();}
  if(!v)return fail("Masukkan PIN master atau NPSN sekolah.");
  if(v===MASTER_PIN){
    G.authed=true;G.mode="master";G.npsn="";G.sekolah="";persist();loadRows();return;
  }
  var sch=null;
  for(var i=0;i<SCHOOLS.length;i++)if(SCHOOLS[i].npsn===v){sch=SCHOOLS[i];break;}
  if(sch){
    G.authed=true;G.mode="npsn";G.npsn=sch.npsn;G.sekolah=sch.nama;persist();loadRows();return;
  }
  fail("PIN / NPSN tidak dikenal. Periksa kembali.");
}
document.getElementById("g-body").addEventListener("click",function(e){
  var el=e.target.closest("[data-act]");if(!el)return;
  var act=el.getAttribute("data-act"),v=el.getAttribute("data-v");
  if(act==="login")doLogin();
  else if(act==="logout"){G.authed=false;G.mode="";G.npsn="";G.sekolah="";G.rows=[];persist();render();}
  else if(act==="tab"){G.tab=v;G.showAll=false;render();}
  else if(act==="more"){G.showAll=true;render();}
  else if(act==="reload")loadRows();
  else if(act==="csv")downloadCSV();
});
if(G.authed)loadRows();else render();
})();
</script>
</body>
</html>
